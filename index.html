<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>DOM Manipulation Demo</h1>
    </header>
    
    <main>
        <section id="content-section">
            <h2 id="dynamic-text">josepy muriithi Text Content</h2>
            <p class="description">This is a paragraph that will be styled dynamically.</p>
            <div id="toggle-element" class="box">This is an element that can be toggled</div>
        </section>
        
        <section id="controls">
            <button id="change-text-btn">Change Text</button>
            <button id="style-btn">Change Styles</button>
            <button id="toggle-element-btn">Toggle Element</button>
        </section>
    </main>
    
    <footer>
        <p>JavaScript DOM Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
